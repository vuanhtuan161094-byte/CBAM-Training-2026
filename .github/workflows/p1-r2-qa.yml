name: P1-R3/R4 structural and source-text QA

on:
  pull_request:
    branches:
      - codex/issue-2-p0-source-inventory
    paths:
      - "README.md"
      - "legal/**"
      - "glossary/**"
      - "translations/**"
      - "scripts/**"
      - "source-register/**"
      - "qa/**"
      - ".github/workflows/p1-r2-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-qa:
    name: P0 hashes, P1-R2/R3/R4 structure and original text
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extraction dependency
        run: python -m pip install pypdf==5.9.0

      - name: Record tested commit
        run: |
          echo "tested_commit=$(git rev-parse HEAD)"
          echo "workflow_sha=${GITHUB_SHA}"

      - name: Verify official source inventory and local SHA256 files
        run: python scripts/check_source_inventory.py

      - name: Verify P1-R2/R3/R4 source coverage, clause pairs, claims, glossary and watermark
        run: python scripts/check_p1_structure.py

      - name: Test P1-R3/R4 formula evidence against intentional mutations
        run: python -m unittest discover -s tests -p 'test_p1_formula_evidence.py' -v

      - name: Verify P1-R3/R4 formula source hashes, rendered pages and EN–VI lines
        run: python scripts/check_p1_formula_evidence.py

      - name: Compare selected clauses and claims with hash-verified local EU originals
        run: python scripts/check_p1_original_text.py

      - name: Record exact-SHA QA summary
        if: always()
        run: |
          echo "## P1-R3/R4 exact-SHA QA" >> "$GITHUB_STEP_SUMMARY"
          echo "tested_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "workflow_sha=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source comparison and separate formula evidence are attached as the p1-r3-r4-source-text-validation artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clause-to-original comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-r3-r4-source-text-validation
          path: qa/P1_R3_SOURCE_TEXT_VALIDATION.csv
          if-no-files-found: warn

      - name: Check patch whitespace
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
