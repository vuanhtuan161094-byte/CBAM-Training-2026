name: Expert course package integrity

on:
  push:
    branches:
      - codex/issue-5-exp01-2026-11-18
    paths:
      - ".github/workflows/expert-course-integrity.yml"
      - "tools/expert-course/**"
      - "outputs/issue-5-expert-course/**"
  pull_request:
    branches:
      - codex/delivery-acceleration-v2-client-model
    paths:
      - ".github/workflows/expert-course-integrity.yml"
      - "tools/expert-course/**"
      - "outputs/issue-5-expert-course/**"

permissions:
  contents: read

jobs:
  expert-course-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document QA dependencies
        run: python -m pip install --disable-pip-version-check python-docx pypdf openpyxl

      - name: Verify expert course package
        run: python tools/expert-course/qa_committed_artifacts.py
